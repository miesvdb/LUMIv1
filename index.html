<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5EFC6" />
  <title>Lumi</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lumi" />
  <link rel="apple-touch-icon" href="icon-192.png" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow" id="todayLabel">Vandaag</div>
        <h1 id="pageTitle">Goedemorgen</h1>
      </div>
      <button class="icon-btn" id="quickAddBtn" aria-label="Snel toevoegen"><span class="plus-symbol">+</span></button>
    </header>

    
    <section id="onboarding" class="onboarding hidden">
      <div class="onboard-card">
        <div class="onboard-progress"><span id="onboardProgress"></span></div>
        <div id="onboardStep"></div>
        <div class="modal-actions">
          <button id="onboardBack" class="secondary" type="button">Terug</button>
          <button id="onboardNext" class="primary" type="button">Volgende</button>
        </div>
      </div>
    </section>
    <main id="content" class="content"></main>

    <nav class="bottom-nav" aria-label="Hoofdnavigatie">
      <button class="nav-item active" data-page="home"><span class="nav-mark">H</span><small>Vandaag</small></button>
      <button class="nav-item" data-page="budget"><span class="nav-mark">B</span><small>Budget</small></button>
      <button class="nav-item" data-page="meals"><span class="nav-mark">M</span><small>Eten</small></button>
      <button class="nav-item" data-page="agenda"><span class="nav-mark">A</span><small>Agenda</small></button>
      <button class="nav-item" data-page="cleaning"><span class="nav-mark">S</span><small>Schoonmaak</small></button>
      <button class="nav-item" data-page="profile"><span class="nav-mark">P</span><small>Profiel</small></button>
    </nav>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <div class="modal-head">
        <h2 id="modalTitle">Toevoegen</h2>
        <button value="cancel" class="icon-btn">×</button>
      </div>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button value="cancel" class="secondary">Annuleren</button>
        <button id="saveModalBtn" value="default" class="primary">Opslaan</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
